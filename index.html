<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Qui est le plus… ?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e6e0ff;--card:#fff;--ink:#17123a;--mut:#5d578a;--pink:#ff3d8b;--lime:#c8f169;--sel:#17123a;--selt:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#120e2b;--card:#201a45;--ink:#f3f0ff;--mut:#a59fd6;--sel:#c8f169;--selt:#17123a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.4 "Bricolage Grotesque",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:2.4rem;line-height:1;margin:.3em 0;font-weight:800;letter-spacing:-.03em}
h2{font-size:1.5rem;line-height:1.15;margin:0 0 .5em;font-weight:800}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:16px;margin:14px 0}
.mut{color:var(--mut)}
button,input,textarea{font:inherit;color:var(--ink)}
input,textarea{width:100%;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:10px 12px;margin:6px 0}
textarea{resize:vertical;min-height:84px}
button{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
.go{background:var(--pink);color:#fff;width:100%;font-size:1.1rem;margin-top:10px}
.opt{display:block;width:100%;text-align:left;margin:8px 0}
.opt.on{background:var(--sel);color:var(--selt)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{border:2px solid var(--ink);border-radius:99px;padding:2px 12px;font-weight:700;background:var(--card)}
.pill.me{background:var(--lime);color:#17123a}
.q{font-size:1.7rem;line-height:1.15;font-weight:800;margin:.2em 0 .4em;letter-spacing:-.02em}
.badge{display:inline-block;background:var(--lime);color:#17123a;border:2px solid var(--ink);border-radius:8px;padding:0 8px;font-weight:700;font-size:.9rem}
.link{word-break:break-all;background:var(--bg);border-radius:8px;padding:8px;margin:8px 0;font-size:.95rem}
ol{margin:.4em 0 0;padding-left:1.4em}
.new{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.res{display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px dashed var(--mut)}
.res:last-child{border:0}
.x{padding:0 6px;margin-left:2px;border:0;box-shadow:none;background:none;color:var(--pink)}
select{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:4px}
ul{margin:.3em 0 0;padding-left:1.2em}
.louis{text-align:center;animation:burst .5s ease-out}
.lface{width:220px;max-width:70%;aspect-ratio:3/4;object-fit:cover;object-position:center 30%;border-radius:16px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--pink);animation:wob 1s ease-in-out infinite alternate}
.lmini{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;border:2px solid var(--ink)}
@keyframes burst{from{transform:scale(.6);opacity:0}}
@keyframes wob{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@media(prefers-reduced-motion:reduce){.louis,.lface{animation:none}}
.av{display:inline-block;width:1.7em;height:1.7em;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:.3em;border:2px solid var(--ink);background:var(--lime);color:#17123a;text-align:center;font-size:.85em;line-height:calc(1.7em - 4px);font-weight:800}
.pp{padding:2px;border-radius:50%;box-shadow:3px 3px 0 var(--ink)}
.ppi{width:48px;height:48px;border-radius:50%;object-fit:cover;display:block}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;max-width:90%}
@media(prefers-reduced-motion:reduce){.new{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let peer,isHost=false,me=null,conns={},hostConn=null,code='',myName='',G=null,S=null,lost=false,wait='';
let AV={},myAv=null;
let L={key:'',pick:null,rank:[],q:'',mode:'single'};
const store={get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3000)}
const link=()=>location.href.split('#')[0]+'#'+code;

/* ---------- Réseau ---------- */
function startHost(){
  isHost=true;me='host';
  code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.random()*24|0]).join('');
  peer=new Peer('fr-'+code);
  peer.on('open',()=>{
    G={players:[{id:'host',name:myName}],names:{host:myName},ptr:0,round:0,phase:'lobby',q:'',mode:'',parts:[],answers:{},order:[],revealed:0,hist:[],mark:0,every:10,recap:[],louis:false,who:0,img:0,intro:0,lp:0.2,av:{host:myAv||''}};
    AV=G.av;location.hash=code;push();
  });
  peer.on('error',e=>{if(e.type==='unavailable-id'){peer.destroy();startHost()}else fail('Erreur réseau ('+e.type+')')});
  peer.on('connection',c=>{
    conns[c.peer]=c;
    c.on('data',m=>{act(c.peer,m);if(m.t==='join')shareAv(c)});
    c.on('close',()=>{delete conns[c.peer];removePlayer(c.peer);push()});
  });
}
function startJoin(c){
  code=c;peer=new Peer();
  const t=setTimeout(()=>fail('Connexion impossible. Vérifie le code ou ton réseau.'),12000);
  peer.on('open',id=>{
    me=id;hostConn=peer.connect('fr-'+code,{reliable:true});
    hostConn.on('open',()=>{clearTimeout(t);hostConn.send({t:'join',name:myName,av:myAv||''})});
    hostConn.on('data',m=>{if(m.t==='kick'){lost='kick';render()}else if(m.t==='avs'){Object.assign(AV,m.av);render()}else if(m.t==='s')apply(m.s)});
    hostConn.on('close',()=>{lost=lost||true;render()});
  });
  peer.on('error',e=>{clearTimeout(t);fail(e.type==='peer-unavailable'?'Salon introuvable. Vérifie le lien ou le code.':'Erreur réseau ('+e.type+')')});
}
function fail(m){if(peer)peer.destroy();S=null;G=null;wait='';toast(m);render()}
function send(m){if(isHost)act('host',m);else hostConn.send(m)}
function act(id,m){handle(id,m);push()}
function push(){
  const g=G,ans={};g.order.slice(0,g.revealed).forEach(i=>ans[i]=g.answers[i]);
  const v={players:g.players,names:g.names,asker:g.players[g.ptr]&&g.players[g.ptr].id,round:g.round,phase:g.phase,q:g.q,mode:g.mode,parts:g.parts,done:Object.keys(g.answers),order:g.phase==='reveal'?g.order:[],revealed:g.revealed,ans,every:g.every,recap:g.phase==='recap'?g.recap:[],louis:g.louis,who:g.who,img:g.img,intro:g.intro,lp:g.lp};
  Object.values(conns).forEach(c=>c.open&&c.send({t:'s',s:v}));apply(v);
}
function apply(v){
  S=v;wait='';
  const k=v.round+v.phase;
  if(k!==L.key){L.key=k;L.pick=null;L.rank=[];L.sug=null}
  render();
}

/* ---------- Logique (hôte) ---------- */
function startTurn(){
  const g=G,prev=g.louis;g.round++;g.phase='ask';g.q='';g.mode='';g.louis=false;g.answers={};g.order=[];g.revealed=0;g.parts=g.players.map(p=>p.id);
  if(!prev&&g.round>1&&CH.every(c=>c.img.length)&&Math.random()<g.lp){
    g.who=Math.random()<0.12?2:deal('dw',2);const q=CH[g.who].q[deal('dq'+g.who,CH[g.who].q.length)];
    g.louis=true;g.img=deal('di'+g.who,CH[g.who].img.length);g.intro=Math.random()*CH[g.who].intro.length|0;g.mode=q[0];g.q=q[1];g.phase='louis';
    const r=g.round;setTimeout(()=>{if(G&&G.round===r&&G.phase==='louis'){G.phase='answer';push()}},4500);
  }
}
function check(){
  const g=G;
  if(g.phase==='answer'&&g.parts.every(p=>p in g.answers)){
    g.phase='reveal';g.order=g.parts.slice().sort(()=>Math.random()-.5);g.revealed=0;
  }
}
function removePlayer(id){
  const g=G,i=g.players.findIndex(p=>p.id===id);if(i<0)return;
  const wasAsker=i===g.ptr;
  g.players.splice(i,1);if(i<g.ptr)g.ptr--;
  g.ptr%=g.players.length;
  g.parts=g.parts.filter(x=>x!==id);
  if(g.phase==='answer')delete g.answers[id];
  if(g.phase!=='lobby'){
    if(g.players.length<2)g.phase='lobby';
    else if(wasAsker&&(g.phase==='ask'||g.phase==='answer'))startTurn();
    else check();
  }
}
const av=i=>AV[i]?`<img class="av" src="${AV[i]}" alt="">`:`<span class="av">${esc(((S&&S.names[i])||'?').trim().charAt(0).toUpperCase()||'?')}</span>`;
function readAv(f){return new Promise(res=>{if(!f)return res('');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),n=96,z=Math.min(im.width,im.height),x=c.getContext('2d');c.width=c.height=n;x.drawImage(im,(im.width-z)/2,(im.height-z)/2,z,z,0,0,n,n);res(c.toDataURL('image/jpeg',.7))};im.onerror=()=>res('');im.src=r.result};r.onerror=()=>res('');r.readAsDataURL(f)})}
function shareAv(c){
  c.send({t:'avs',av:G.av});
  const one=G.av[c.peer];if(!one)return;
  Object.values(conns).forEach(o=>{if(o!==c&&o.open)o.send({t:'avs',av:{[c.peer]:one}})});
}
function tops(){
  const g=G,v=Object.values(g.answers);if(!v.length)return[];
  let t=[];
  if(g.mode==='single'){const c={};v.forEach(x=>c[x]=(c[x]||0)+1);const m=Math.max(...Object.values(c));t=Object.keys(c).filter(k=>c[k]===m)}
  else{const r={};v.forEach(l=>l.forEach((i,k)=>(r[i]=r[i]||[]).push(k+1)));const a=Object.keys(r).map(i=>[i,r[i].reduce((x,y)=>x+y)/r[i].length]),m=Math.min(...a.map(x=>x[1]));t=a.filter(x=>x[1]===m).map(x=>x[0])}
  return t.length>2?[]:t;
}
function makeRecap(){
  const g=G,m={};
  g.hist.slice(g.mark).forEach(h=>h.top.forEach(i=>(m[i]=m[i]||[]).push(h.q)));
  g.mark=g.hist.length;
  g.recap=g.players.map(p=>[p.id,m[p.id]||[]]).sort((a,b)=>b[1].length-a[1].length);
}
function handle(id,m){
  const g=G,asker=g.players[g.ptr]&&g.players[g.ptr].id,ctl=id===asker||id==='host';
  if(m.t==='join'){
    if(g.players.some(p=>p.id===id))return;
    let b=String(m.name||'Anonyme').trim().slice(0,16)||'Anonyme',n=b,i=2;
    while(g.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))n=b+i++;
    g.players.push({id,name:n});g.names[id]=n;
    if(typeof m.av==='string'&&m.av.length<20000&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(m.av))g.av[id]=m.av;
  }else if(m.t==='start'&&id==='host'&&g.phase==='lobby'&&g.players.length>1){
    startTurn();
  }else if(m.t==='ask'&&id===asker&&g.phase==='ask'){
    const q=String(m.text||'').trim().slice(0,140);if(!q)return;
    g.q=q;g.mode=m.mode==='rank'?'rank':'single';g.parts=g.players.map(p=>p.id);g.phase='answer';
  }else if(m.t==='answer'&&g.phase==='answer'&&g.parts.includes(id)&&!(id in g.answers)){
    if(g.mode==='single'){if(!g.parts.includes(m.v))return;g.answers[id]=m.v}
    else{
      const o=g.parts,v=Array.isArray(m.v)?m.v:[];
      if(v.length!==o.length||new Set(v).size!==v.length||!v.every(x=>o.includes(x)))return;
      g.answers[id]=v;
    }
    check();
  }else if(m.t==='force'&&id==='host'&&g.phase==='answer'){
    const d=g.parts.filter(p=>p in g.answers);if(d.length){g.parts=d;check()}
  }else if(m.t==='adv'&&ctl&&g.phase==='reveal'&&g.revealed<g.order.length){
    g.revealed++;
  }else if(m.t==='next'&&ctl&&g.phase==='reveal'&&g.revealed>=g.order.length){
    g.hist.push({q:g.q,top:tops()});if(!g.louis)g.ptr=(g.ptr+1)%g.players.length;if(g.every&&g.round%g.every===0){makeRecap();g.phase='recap'}else startTurn();
  }else if(m.t==='cont'&&ctl&&g.phase==='recap'){
    startTurn();
  }else if(m.t==='kick'&&id==='host'&&m.id!=='host'&&g.players.some(p=>p.id===m.id)){
    const c=conns[m.id];if(c&&c.open){c.send({t:'kick'});setTimeout(()=>c.close(),400)}removePlayer(m.id);
  }else if(m.t==='every'&&id==='host'&&[0,5,10,15,20].includes(m.v)){
    g.every=m.v;
  }else if(m.t==='lp'&&id==='host'&&[0,0.1,0.2,0.35].includes(m.v)){
    g.lp=m.v;
  }
}

/* ---------- Interface ---------- */
const QS=["Qui survivrait le moins longtemps dans un film d'horreur ?", "Qui finirait en prison pour une raison complètement stupide ?", "Qui pleurerait le moins à mon enterrement ?", "Qui finirait dans une secte sans s'en rendre compte ?", "Qui vendrait un ami pour 10 000 € ?", "Qui a l'historique de navigation le plus dur à expliquer ?", "Qui trahirait le groupe en premier dans Koh-Lanta ?", "Qui ferait le pire parent ?", "Qui se ferait virer en premier de son futur travail ?", "Qui a déjà eu un faible pour quelqu'un de ce salon ?", "Qui cacherait un cadavre le plus efficacement ?", "Qui finira remis avec son ex ?", "Qui a déjà fait l'amour dans un endroit complètement improbable ?", "Qui irait à un enterrement juste pour le buffet ?", "Qui a déjà triché à un examen sans jamais se faire prendre ?", "Qui ferait un excellent tueur en série (en théorie) ?", "Qui gagnerait un procès avec un mensonge ?", "Qui finirait en télé-réalité avec le moins de dignité ?", "Qui ferait le plus de bêtises sous l'emprise de l'alcool ?", "Qui a déjà envoyé un message intime à la mauvaise personne ?", "Qui serait le premier à mourir dans une apocalypse zombie ?", "Qui pourrait écrire un livre sur ses galères sentimentales ?", "Qui a déjà dragué quelqu'un avec une phrase d'accroche catastrophique ?", "Qui finira sur le canapé de ses parents à 40 ans ?", "Qui répondrait « oui » à un plan à trois sans réfléchir ?", "Qui a déjà pleuré à cause d'un jeu vidéo ?", "Qui adopterait un chien pour ne jamais le promener ?", "Qui accepterait de tourner dans un film pour adultes pour 50 000 € ?", "Qui deviendrait influenceur(se) en vendant n'importe quoi ?", "Qui s'endormirait en pleine soirée ?", "Qui a déjà fait pipi sous la douche et le nie ?", "Qui ferait un testament uniquement pour se venger ?", "Qui mentirait sur son CV avec le plus d'aplomb ?", "Qui a le plus de chances de gagner un Nobel ?", "Qui était le chouchou du prof à l'école ?", "Qui était le cancre de la classe ?", "Qui a déjà copi const USED=new Set();
const take=a=>{let p=a.filter(x=>!USED.has(x));if(!p.length){a.forEach(x=>USED.delete(x));p=a}const x=p[Math.random()*p.length|0];USED.add(x);return x};
const draw=()=>[['single',take(QS)],['rank',take(QR)]];
function sugHtml(){
  if(!L.sug)L.sug=draw();
  return `<div class="card"><h2>À toi de poser la question</h2><p class="mut">Touche une idée pour la lancer.</p>${L.sug.map((x,i)=>`<button class="opt" data-a="sug" data-v="${i}"><span class="badge">${MODES[x[0]]}</span><br>${esc(x[1])}</button>`).join('')}<button data-a="more">🔀 Autres idées</button></div>`;
}

const MODES={single:'🎯 Un seul nom',rank:'📊 Classement'};
function summary(s){
  const vals=s.order.map(i=>s.ans[i]);
  if(s.mode==='single'){
    const c={};s.parts.forEach(i=>c[i]=0);vals.forEach(v=>c[v]=(c[v]||0)+1);
    return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([i,n])=>[i,n+(n>1?' votes':' vote')]);
  }
  const t={};vals.forEach(l=>l.forEach((i,k)=>(t[i]=t[i]||[]).push(k+1)));
  return Object.entries(t).map(([i,a])=>[i,a.reduce((x,y)=>x+y)/a.length]).sort((a,b)=>a[1]-b[1]).map(([i,v])=>[i,'position moy. '+v.toFixed(1)]);
}
function home(){
  const c=location.hash.slice(1).toUpperCase();
  if(myAv===null)myAv=store.get('av');
  return `<h1>Qui est le plus… ?</h1>
  <p class="mut">Un jeu de questions et de classements entre amis. Une question, tout le monde répond, on découvre les réponses une par une.</p>
  <div class="card">
    <label for="name"><b>Ton pseudo</b> (visible par tous)</label>
    <input id="name" maxlength="16" autocomplete="off" value="${esc(store.get('name'))}">
    <label for="avf"><b>Photo de profil</b> (facultatif)</label>
    <div class="row"><span id="avw">${myAv?`<img class="av" src="${myAv}" alt="">`:''}</span><input type="file" id="avf" accept="image/*" style="flex:1"></div>
    <p class="mut" style="margin:8px 0 2px">Ou choisis une photo dans la banque :</p>
    <div class="row">${PRESETS.map((a,i)=>`<button class="pp" data-a="pickav" data-v="${i}" aria-label="Photo ${i+1}"><img class="ppi" src="${a}" alt=""></button>`).join('')}<button data-a="noav">Aucune</button></div>
    ${c?'':`<button class="go" data-a="create">Créer un salon</button><p class="mut" style="margin:14px 0 0">Ou rejoins un salon avec son code :</p>`}
    <input id="code" maxlength="4" placeholder="Code du salon" autocomplete="off" value="${esc(c)}" style="text-transform:uppercase">
    <button class="${c?'go':''}" data-a="join" style="${c?'':'width:100%'}">Rejoindre le salon</button>
  </div>`;
}
function game(){
  const s=S,nm=i=>esc(s.names[i]||'?'),isA=me===s.asker,ctl=isA||isHost,inP=s.parts.includes(me);
  let h=`<div class="row" style="justify-content:space-between"><b>Salon ${esc(code)}</b><button data-a="copy">Copier le lien</button></div>
  <div class="row" style="margin-top:12px">${s.players.map(p=>`<span class="pill ${p.id===me?'me':''}">${p.id===s.asker&&s.phase!=='lobby'&&!s.louis?'🎤 ':''}${p.id==='host'?'👑 ':''}${av(p.id)}${esc(p.name)}${isHost&&p.id!=='host'?` <button class="x" data-a="kick" data-v="${esc(p.id)}" aria-label="Exclure ${esc(p.name)}">✕</button>`:''}</span>`).join('')}</div>`;
  if(s.phase==='lobby'){
    h+=`<div class="card"><h2>Le salon est ouvert</h2><p class="mut">Envoie ce lien à tes amis, ils choisiront leur pseudo en arrivant.</p><div class="link">${esc(link())}</div>${isHost?`<label>Invités surprise (Louis, Nathan) <select id="lp">${[[0,'jamais'],[0.1,'rarement'],[0.2,'de temps en temps'],[0.35,'souvent']].map(([v,t])=>`<option value="${v}" ${s.lp===v?'selected':''}>${t}</option>`).join('')}</select></label><br>`:''}${isHost?`<label>Récap des « n°1 » tous les <select id="ev">${[5,10,15,20,0].map(n=>`<option value="${n}" ${s.every===n?'selected':''}>${n||'jamais'}</option>`).join('')}</select> tours</label>`:`<p class="mut">${s.every?'Récap tous les '+s.every+' tours.':'Pas de récap.'}</p>`}
    ${isHost?`<button class="go" data-a="start" ${s.players.length<2?'disabled':''}>${s.players.length<2?'Il faut au moins 2 joueurs':'Lancer la partie'}</button>`:`<p><b>En attente de l’hôte…</b></p>`}</div>`;
  }else if(s.phase==='louis'){
    h+=`<div class="card louis"><img class="lface" src="${CH[s.who].img[s.img]}" alt=""><h2>${CH[s.who].emoji} ${CH[s.who].name} est arrivé !</h2><p class="mut">${esc(CH[s.who].intro[s.intro]||'')}</p></div>`;
  }else if(s.phase==='recap'){
    h+=`<div class="card"><h2>🏆 Récap des ${s.every} derniers tours</h2><p class="mut">Qui a terminé n°1 sur quelles questions (à partir de 3 ex æquo, personne n’est compté).</p>${s.recap.map(([id,qs])=>`<div class="res" style="display:block">${av(id)}<b>${nm(id)}</b> ${qs.length?`a été n°1 sur ${qs.length} question${qs.length>1?'s':''} :<ul>${qs.map(q=>`<li>${esc(q)}</li>`).join('')}</ul>`:'n’a été n°1 sur aucune question.'}</div>`).join('')}</div>`;
    h+=ctl?`<button class="go" data-a="cont">Continuer la partie</button>`:`<p class="mut" style="text-align:center">En attente de la suite…</p>`;
  }else if(s.phase==='ask'){
    h+=isA?`${sugHtml()}<div class="card"><h2>Ou écris la tienne</h2>
      <textarea id="qtxt" maxlength="140" placeholder="Qui est le plus susceptible de rater son train ?">${esc(L.q)}</textarea>
      <button class="opt ${L.mode==='single'?'on':''}" data-a="mode" data-v="single">🎯 Un seul nom<br><small>Chacun désigne un joueur.</small></button>
      <button class="opt ${L.mode==='rank'?'on':''}" data-a="mode" data-v="rank">📊 Classement<br><small>Chacun classe tous les joueurs, lui-même compris, du plus au moins.</small></button>
      <button class="go" data-a="ask">Lancer la question</button></div>`
    :`<div class="card"><h2>${nm(s.asker)} rédige sa question…</h2><p class="mut">Ça arrive.</p></div>`;
  }else{
    h+=`<div class="card"><span class="badge">${MODES[s.mode]}</span><div class="q">${esc(s.q)}</div><span class="mut">Posée par ${s.louis?`<img class="lmini" src="${CH[s.who].img[s.img]}" alt=""> <b>${CH[s.who].name}</b>`:nm(s.asker)}</span></div>`;
    if(s.phase==='answer'){
      if(!inP)h+=`<div class="card">Tu rejoins la partie au prochain tour.</div>`;
      else if(s.done.includes(me)){
        const pend=s.parts.filter(i=>!s.done.includes(i));
        h+=`<div class="card"><h2>Réponse envoyée ✓</h2><p class="mut">En attente de : ${pend.map(nm).join(', ')}</p>${isHost?`<button data-a="force">Passer sans attendre</button>`:''}</div>`;
      }else if(s.mode==='single'){
        h+=`<div class="card"><h2>Ta réponse</h2>${s.parts.map(i=>`<button class="opt ${L.pick===i?'on':''}" data-a="pick" data-v="${esc(i)}">${av(i)}${nm(i)}${i===me?' (toi)':''}</button>`).join('')}
        <button class="go" data-a="send" ${L.pick?'':'disabled'}>Valider</button></div>`;
      }else{
        const left=s.parts.filter(i=>!L.rank.includes(i));
        h+=`<div class="card"><h2>Ton classement</h2><p class="mut">Touche les joueurs dans l’ordre : du plus au moins.</p>
        ${L.rank.map((i,k)=>`<button class="opt on" data-a="rdel" data-v="${esc(i)}">${k+1}. ${av(i)}${nm(i)}${i===me?' (toi)':''} ✕</button>`).join('')}
        ${left.map(i=>`<button class="opt" data-a="radd" data-v="${esc(i)}">${av(i)}${nm(i)}${i===me?' (toi)':''}</button>`).join('')}
        <button class="go" data-a="send" ${left.length?'disabled':''}>Valider</button></div>`;
      }
    }else{
      const n=s.order.length,all=s.revealed>=n;
      s.order.slice(0,s.revealed).reverse().forEach((id,k)=>{
        const a=s.ans[id];
        h+=`<div class="card ${k===0?'new':''}">${av(id)}<b>${nm(id)}</b> ${s.mode==='single'?`a répondu ${av(a)}<b>${nm(a)}</b>`:`classe :<ol>${a.map(i=>`<li>${av(i)}${nm(i)}</li>`).join('')}</ol>`}</div>`;
      });
      if(!all)h+=ctl?`<button class="go" data-a="adv">${s.revealed?'Réponse suivante':'Voir la première réponse'} (${s.revealed}/${n})</button>`:`<p class="mut" style="text-align:center">${s.revealed}/${n} réponses — ${nm(s.asker)} fait défiler.</p>`;
      else{
        h+=`<div class="card"><h2>${s.mode==='single'?'Résultat des votes':'Classement général'}</h2>${summary(s).map(([i,t],k)=>`<div class="res"><span>${['🥇','🥈','🥉'][k]||(k+1)+'.'} ${av(i)}<b>${nm(i)}</b></span><span class="mut">${t}</span></div>`).join('')}</div>`;
        h+=ctl?`<button class="go" data-a="next">Tour suivant</button>`:`<p class="mut" style="text-align:center">En attente du tour suivant…</p>`;
      }
    }
  }
  return h;
}
function render(){
  const app=$('#app'),foc=document.activeElement&&document.activeElement.id==='qtxt';
  if(lost)app.innerHTML=`<div class="card"><h2>${lost==='kick'?'Tu as été exclu':'Connexion perdue'}</h2><p>${lost==='kick'?'L’hôte t’a retiré du salon.':'L’hôte a quitté le salon ou sa connexion a coupé.'}</p><button class="go" data-a="reload">Revenir à l’accueil</button></div>`;
  else if(S)app.innerHTML=game();
  else if(wait)app.innerHTML=`<div class="card"><h2>${wait}</h2></div>`;
  else app.innerHTML=home();
  if(foc){const t=$('#qtxt');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length)}}
}
function pseudo(){const n=($('#name').value||'').trim().slice(0,16);if(!n){toast('Choisis un pseudo');return ''}store.set('name',n);return n}
const A={
  create(){const n=pseudo();if(!n)return;myName=n;wait='Création du salon…';render();startHost()},
  join(){const n=pseudo(),c=($('#code').value||'').trim().toUpperCase();if(!n)return;if(c.length!==4)return toast('Entre le code à 4 lettres');myName=n;wait='Connexion au salon…';render();startJoin(c)},
  copy(){const l=link();(navigator.clipboard?navigator.clipboard.writeText(l):Promise.reject()).then(()=>toast('Lien copié')).catch(()=>prompt('Copie ce lien :',l))},
  start(){send({t:'start'})},
  mode(v){L.mode=v;render()},
  ask(){const q=(L.q||'').trim();if(!q)return toast('Écris ta question');send({t:'ask',text:q,mode:L.mode});L.q=''},
  sug(v){const x=L.sug&&L.sug[v];if(x)send({t:'ask',text:x[1],mode:x[0]})},more(){L.sug=draw();render()},kick(v){const n=S.names[v]||'ce joueur';if(confirm('Exclure '+n+' du salon ?'))send({t:'kick',id:v})},cont(){send({t:'cont'})},pick(v){L.pick=v;render()},
  radd(v){L.rank.push(v);render()},
  rdel(v){L.rank=L.rank.filter(x=>x!==v);render()},
  send(){send({t:'answer',v:S.mode==='single'?L.pick:L.rank})},
  adv(){send({t:'adv'})},
  next(){send({t:'next'})},
  force(){send({t:'force'})},
  pickav(v){myAv=PRESETS[v];store.set('av',myAv);$('#avw').innerHTML=`<img class="av" src="${myAv}" alt="">`},noav(){myAv='';store.set('av','');$('#avw').innerHTML=''},reload(){location.reload()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled)A[b.dataset.a](b.dataset.v)});
document.addEventListener('change',e=>{if(e.target.id==='avf')readAv(e.target.files[0]).then(a=>{if(a){myAv=a;store.set('av',a);$('#avw').innerHTML=`<img class="av" src="${a}" alt="">`}else toast('Image illisible')});if(e.target.id==='ev')send({t:'every',v:+e.target.value});if(e.target.id==='lp')send({t:'lp',v:+e.target.value})});
document.addEventListener('input',e=>{if(e.target.id==='qtxt')L.q=e.target.value});
render();
</script>
</body>
</html>
